# Builds and tests UniFiles on every push and pull request, on Windows and macOS (Linux isn't shipped yet).
# The runners have neither ffmpeg nor Ghostscript: the tests needing them pass trivially there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build UniFiles.slnx -c Release -warnaserror

      - name: Test
        # Minimal output: only the failing tests are printed, with their message.
        run: dotnet test UniFiles.slnx -c Release --no-build --logger "console;verbosity=minimal"
