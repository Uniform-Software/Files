# Builds and tests UniFiles on every push and pull request, on the three desktop systems.
# Linux also installs ffmpeg and Ghostscript, so the video and PDF compression tests really run
# (elsewhere they pass trivially when the programs are missing).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Same ffmpeg version as the installers (Ubuntu's is too old for tiled HEIC photos).
      - name: ffmpeg 9.0.2 and Ghostscript (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ghostscript
          base=https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -fsSL "$base/ffmpeg.zip" -o ffmpeg.zip
          curl -fsSL "$base/ffprobe.zip" -o ffprobe.zip
          echo "fa8ecf4abbd290d98f7d188b8649cc6b391ae209a98452be955a15aab1909d7f  ffmpeg.zip" | sha256sum -c -
          echo "3f428c49070be3d24ec338602b76d412e401ffcb8a5641ef0e729181a232fc32  ffprobe.zip" | sha256sum -c -
          unzip -q ffmpeg.zip -d "$RUNNER_TEMP/ffmpeg" && unzip -q ffprobe.zip -d "$RUNNER_TEMP/ffmpeg"
          chmod +x "$RUNNER_TEMP/ffmpeg/"*
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"

      - name: Build (warnings are errors)
        run: dotnet build UniFiles.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test UniFiles.slnx -c Release --no-build --logger "console;verbosity=normal"
